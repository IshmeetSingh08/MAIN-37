<details id="register"><summary>Register</summary><p>%%NOTE%%</p>
<form action="/demo/register" method="post">
  <input type="hidden" name="role" value="%%KEY%%">
  <label>Name<input name="name" autocomplete="name" required maxlength="80"></label>
  <label>Registration email<input type="email" name="email" autocomplete="email" required maxlength="160"></label>
  <label>Create password<input type="password" name="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
  <button class="primary">Submit registration</button>
</form></details>
